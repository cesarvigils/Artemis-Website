name: CI

on:
  push:
    branches: [preview, master]
  pull_request:
    # `master` plus the branches Claude works on, because a stack of
    # dependent PRs bases each one on the branch below it rather than on
    # master. With `master` alone only the bottom PR of a stack ran CI and
    # the ones above it showed whatever their commits happened to have run
    # earlier - green ticks that no longer meant "tested against this base".
    branches: [master, 'claude/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright's Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        working-directory: tests
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse floors
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright's Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run Lighthouse
        working-directory: tests
        run: npm run test:lh

      # `include-hidden-files` because the reports land in `.lighthouse/`,
      # and upload-artifact has skipped dotfiles and dot-directories by
      # default since v4.4. Without it this step warned "No files were
      # found" on every run, pass or fail, and quietly uploaded nothing -
      # so the one artifact that explains a Lighthouse failure was never
      # there on the occasion somebody needed it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: tests/.lighthouse/
          include-hidden-files: true
          retention-days: 7

  empty-data:
    name: Empty-data build guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build with each data file emptied, then restore
        run: npm run test:empty --prefix tests

  seo:
    name: SEO structured data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Not a Playwright spec and deliberately not `needs: build`: it
      # asserts on bytes in the emitted HTML, needs no browser, and builds
      # twice itself - once with a driver promoted out of placeholder state
      # so the Person and indexable-page paths actually execute, then again
      # with the real data restored.
      - name: Check JSON-LD, canonicals, robots and the sitemap
        run: npm run test:seo --prefix tests

  sync-tests:
    name: iRacing sync tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # No npm ci: scripts/fetch-iracing.mjs and its tests import nothing but
      # node: builtins and each other, and the API calls are served from
      # scripts/fixtures/iracing. Nothing here touches the network or needs a
      # credential, so this runs in seconds.
      - name: Run the sync suite
        run: npm run test:sync
