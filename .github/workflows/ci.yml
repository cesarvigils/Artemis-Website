name: CI

on:
  push:
    branches: [preview, master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright's Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        working-directory: tests
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse floors
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright's Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run Lighthouse
        working-directory: tests
        run: npm run test:lh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: tests/.lighthouse/
          retention-days: 7

  empty-data:
    name: Empty-data build guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build with each data file emptied, then restore
        run: npm run test:empty --prefix tests

  sync-tests:
    name: iRacing sync tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # No npm ci: scripts/fetch-iracing.mjs and its tests import nothing but
      # node: builtins and each other, and the API calls are served from
      # scripts/fixtures/iracing. Nothing here touches the network or needs a
      # credential, so this runs in seconds.
      - name: Run the sync suite
        run: npm run test:sync
